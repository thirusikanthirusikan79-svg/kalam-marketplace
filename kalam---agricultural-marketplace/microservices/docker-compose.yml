version: '3.8'

services:
  api_gateway:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY api_gateway /app
        EXPOSE 8000
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user_service:8001
      - CROP_SERVICE_URL=http://crop_service:8002
      - TRANSACTION_SERVICE_URL=http://transaction_service:8003
      - TRANSLATION_SERVICE_URL=http://translation_service:8004
    depends_on:
      - user_service
      - crop_service
      - transaction_service
      - translation_service

  user_service:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY user_service /app
        EXPOSE 8001
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - user_data:/app

  crop_service:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY crop_service /app
        EXPOSE 8002
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    volumes:
      - crop_data:/app

  transaction_service:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY transaction_service /app
        EXPOSE 8003
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
    environment:
      - PLATFORM_COMMISSION_PERCENTAGE=0.05
    volumes:
      - transaction_data:/app

  translation_service:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY translation_service /app
        EXPOSE 8004
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8004"]
    ports:
      - "8004:8004"

volumes:
  user_data:
  crop_data:
  transaction_data:
